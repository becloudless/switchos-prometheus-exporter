name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout switchos-prometheus-exporter
        uses: actions/checkout@v4
        with:
          path: switchos-prometheus-exporter

      # switchos-client isn't a published module - it's consumed via a
      # local `replace ... => ../switchos-client` directive in go.mod, so
      # it must be checked out as a sibling directory here too.
      - name: Checkout switchos-client
        uses: actions/checkout@v4
        with:
          repository: becloudless/switchos-client
          path: switchos-client

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: switchos-prometheus-exporter/go.mod

      - name: go vet
        working-directory: switchos-prometheus-exporter
        run: go vet ./...

      - name: gofmt check
        working-directory: switchos-prometheus-exporter
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'ed:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go build
        working-directory: switchos-prometheus-exporter
        run: go build ./...

      - name: go test
        working-directory: switchos-prometheus-exporter
        run: go test ./... -v

  docker:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout switchos-prometheus-exporter
        uses: actions/checkout@v4
        with:
          path: switchos-prometheus-exporter

      - name: Checkout switchos-client
        uses: actions/checkout@v4
        with:
          repository: becloudless/switchos-client
          path: switchos-client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: switchos-prometheus-exporter
          build-contexts: |
            switchos-client=switchos-client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
